[project]
name = "medimaging-xai"
version = "0.1.0"
description = "End-to-end medical imaging AI platform for image reconstruction, analysis, explainability, and clinical interoperability."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydicom>=3.0.2",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups] # cosas que no forman parte del paquete pero se necesitan para el desarrollo
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.build-backend]
module-name = "medimaging"
